name: Weekly NFL import

on:
  schedule:
    # Tuesdays 13:07 UTC ≈ 6:07 AM PDT — before the Tuesday picks breakdown.
    # Off the hour on purpose: GitHub's scheduler is most congested (and most
    # likely to delay or drop a run) at minute 0; the 2026-10-13 13:00 run never fired.
    - cron: '7 13 * * 2'
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run weekly import on the production machine
        run: flyctl ssh console -a nflstats-picks -C "node db/ingest-weekly.mjs"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
